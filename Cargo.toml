[package]
name = "sheikah"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env", "string"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
