[package]
name = "sheikah"
version = "0.3.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
clap = { version = "4.6.6", features = ["derive", "env", "string"] }
ctrlc = "3.5.2"
rand = "0.10.3"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
zeroize = "1.9.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
